[crowsnest]
log_path: ~/printer_data/logs/crowsnest.log
log_level: quiet

# UC346 (OV5647 sensor) CSI camera via libcamera/camera-streamer (設定: 2026-06-05)
# [cam 1]
# mode: camera-streamer
# port: 8080
# device: /base/soc/i2c0mux/i2c@1/ov5647@36
# resolution: 640x480  # 2026-06-30: CPU負荷低減のため720p->480pに変更
# max_fps: 10  # 2026-06-30: CPU負荷低減のため15->10fpsに変更
# v4l2ctl:


# Nebula Camera (CCX2F3298) via USB (設定: 2026-06-15)
[cam 2]
mode: ustreamer
port: 8081
device: /dev/v4l/by-id/usb-UnionImage_Co._Ltd_CCX2F3298_1234567890-video-index0
resolution: 640x480  # 2026-06-30: CPU負荷低減のため720p->480pに変更
max_fps: 10  # 2026-06-26 Claude: CPU負荷低減のため15->10fpsに変更
v4l2ctl: power_line_frequency=1,white_balance_automatic=0,white_balance_temperature=4500,auto_exposure=1,exposure_time_absolute=2000,brightness=128,contrast=128,saturation=128,sharpness=128,backlight_compensation=0

