# LED macros (ADAM)

[neopixel board_neopixel]
pin = gpio16
chain_count = 20
color_order = GRB
initial_red = 0.3
initial_green = 0.3
initial_blue = 0.3

[gcode_macro LED_OFF]
gcode = 
	SET_LED LED=board_neopixel RED=0 GREEN=0 BLUE=0

[gcode_macro LED_WHITE]
gcode = 
	SET_LED LED=board_neopixel RED=1 GREEN=1 BLUE=1

[gcode_macro LED_RED]
gcode = 
	SET_LED LED=board_neopixel RED=1 GREEN=0 BLUE=0

[gcode_macro LED_GREEN]
gcode = 
	SET_LED LED=board_neopixel RED=0 GREEN=1 BLUE=0

[gcode_macro LED_BLUE]
gcode = 
	SET_LED LED=board_neopixel RED=0 GREEN=0 BLUE=1

[gcode_macro LED_PRINTING]
gcode = 
	SET_LED LED=board_neopixel RED=0 GREEN=1 BLUE=1

[gcode_macro LED_DONE]
gcode = 
	{% for i in range(3) %}
	SET_LED LED=board_neopixel RED=0 GREEN=1 BLUE=0
	G4 P400
	SET_LED LED=board_neopixel RED=0 GREEN=0 BLUE=0
	G4 P400
	{% endfor %}
	SET_LED LED=board_neopixel RED=0 GREEN=1 BLUE=0

[gcode_macro LED_HEATING]
gcode = 
	{% for i in range(5) %}
	SET_LED LED=board_neopixel RED=1 GREEN=0.5 BLUE=0
	G4 P300
	SET_LED LED=board_neopixel RED=0.3 GREEN=0.15 BLUE=0
	G4 P300
	{% endfor %}
	SET_LED LED=board_neopixel RED=1 GREEN=0.5 BLUE=0

[gcode_macro LED_ERROR]
gcode = 
	{% for i in range(5) %}
	SET_LED LED=board_neopixel RED=1 GREEN=0 BLUE=0
	G4 P200
	SET_LED LED=board_neopixel RED=1 GREEN=1 BLUE=1
	G4 P200
	{% endfor %}
	SET_LED LED=board_neopixel RED=1 GREEN=0 BLUE=0

[gcode_macro LED_RAINBOW]
gcode = 
	SET_LED LED=board_neopixel RED=1   GREEN=0   BLUE=0
	G4 P500
	SET_LED LED=board_neopixel RED=1   GREEN=0.5 BLUE=0
	G4 P500
	SET_LED LED=board_neopixel RED=1   GREEN=1   BLUE=0
	G4 P500
	SET_LED LED=board_neopixel RED=0   GREEN=1   BLUE=0
	G4 P500
	SET_LED LED=board_neopixel RED=0   GREEN=0   BLUE=1
	G4 P500
	SET_LED LED=board_neopixel RED=0.3 GREEN=0   BLUE=1
	G4 P500
	SET_LED LED=board_neopixel RED=0.5 GREEN=0   BLUE=0.5
	G4 P500

[gcode_macro LED_NIGHT]
gcode = 
	SET_LED LED=board_neopixel RED=0.05 GREEN=0.05 BLUE=0.1

[gcode_macro LED_PRINT_END_SEQ]
gcode = 
	LED_DONE

[gcode_macro LED_POLICE]
gcode = 
	{% for i in range(8) %}
	{% for j in range(1, 11) %}
	SET_LED LED=board_neopixel INDEX={j} RED=1 GREEN=0 BLUE=0 TRANSMIT=0
	{% endfor %}
	{% for j in range(11, 21) %}
	SET_LED LED=board_neopixel INDEX={j} RED=0 GREEN=0 BLUE=1 TRANSMIT={(1 if j == 20 else 0)}
	{% endfor %}
	G4 P150
	{% for j in range(1, 11) %}
	SET_LED LED=board_neopixel INDEX={j} RED=0 GREEN=0 BLUE=1 TRANSMIT=0
	{% endfor %}
	{% for j in range(11, 21) %}
	SET_LED LED=board_neopixel INDEX={j} RED=1 GREEN=0 BLUE=0 TRANSMIT={(1 if j == 20 else 0)}
	{% endfor %}
	G4 P150
	{% endfor %}
	SET_LED LED=board_neopixel RED=0.3 GREEN=0.3 BLUE=0.3

[gcode_macro LED_FIRE]
gcode = 
	{% set flame = [
	(1,0.1,0),(1,0.3,0),(1,0.05,0),(0.8,0.2,0),(1,0.4,0),
	(1,0.15,0),(0.9,0.3,0),(1,0.05,0),(0.7,0.1,0),(1,0.5,0),
	(1,0.2,0),(0.8,0.05,0),(1,0.35,0),(0.9,0.1,0),(1,0.25,0),
	(0.8,0.3,0),(1,0.1,0),(0.7,0.2,0),(1,0.4,0),(0.9,0.15,0)
	] %}
	{% for step in range(12) %}
	{% for j in range(1, 21) %}
	{% set idx = (j + step) % 20 %}
	{% set c = flame[idx] %}
	SET_LED LED=board_neopixel INDEX={j} RED={c[0]} GREEN={c[1]} BLUE={c[2]} TRANSMIT={(1 if j == 20 else 0)}
	{% endfor %}
	G4 P120
	{% endfor %}
	SET_LED LED=board_neopixel RED=1 GREEN=0.2 BLUE=0

[gcode_macro LED_BREATHE]
gcode = 
	{% set steps = [0.0, 0.05, 0.1, 0.2, 0.35, 0.5, 0.65, 0.8, 0.95, 1.0,
	0.95, 0.8, 0.65, 0.5, 0.35, 0.2, 0.1, 0.05, 0.0] %}
	{% for cycle in range(3) %}
	{% for b in steps %}
	SET_LED LED=board_neopixel RED=0 GREEN={b * 0.5} BLUE={b}
	G4 P60
	{% endfor %}
	{% endfor %}
	SET_LED LED=board_neopixel RED=0 GREEN=0.3 BLUE=0.6

[gcode_macro LED_COMET]
gcode = 
	{% for cycle in range(3) %}
	{% for head in range(1, 23) %}
	{% for j in range(1, 21) %}
	{% set dist = head - j %}
	{% if dist == 0 %}
	SET_LED LED=board_neopixel INDEX={j} RED=1 GREEN=1 BLUE=1 TRANSMIT=0
	{% elif dist == 1 %}
	SET_LED LED=board_neopixel INDEX={j} RED=0.6 GREEN=0.6 BLUE=0.6 TRANSMIT=0
	{% elif dist == 2 %}
	SET_LED LED=board_neopixel INDEX={j} RED=0.3 GREEN=0.3 BLUE=0.3 TRANSMIT=0
	{% elif dist == 3 %}
	SET_LED LED=board_neopixel INDEX={j} RED=0.1 GREEN=0.1 BLUE=0.1 TRANSMIT=0
	{% else %}
	SET_LED LED=board_neopixel INDEX={j} RED=0 GREEN=0 BLUE=0 TRANSMIT=0
	{% endif %}
	{% endfor %}
	SET_LED LED=board_neopixel INDEX=20 RED=0 GREEN=0 BLUE=0 TRANSMIT=1
	G4 P60
	{% endfor %}
	{% endfor %}
	SET_LED LED=board_neopixel RED=0.3 GREEN=0.3 BLUE=0.3

[gcode_macro LED_CYLON]
gcode = 
	{% if printer.print_stats.state != "printing" %}
	{% for cycle in range(3) %}
	{% for head in range(1, 21) %}
	{% for j in range(1, 21) %}
	{% set dist = (head - j) if head >= j else (j - head) %}
	{% if dist == 0 %}
	SET_LED LED=board_neopixel INDEX={j} RED=1 GREEN=0 BLUE=0 TRANSMIT=0
	{% elif dist == 1 %}
	SET_LED LED=board_neopixel INDEX={j} RED=0.4 GREEN=0 BLUE=0 TRANSMIT=0
	{% elif dist == 2 %}
	SET_LED LED=board_neopixel INDEX={j} RED=0.1 GREEN=0 BLUE=0 TRANSMIT=0
	{% else %}
	SET_LED LED=board_neopixel INDEX={j} RED=0 GREEN=0 BLUE=0 TRANSMIT=0
	{% endif %}
	{% endfor %}
	SET_LED LED=board_neopixel INDEX=20 RED=0 GREEN=0 BLUE=0 TRANSMIT=1
	G4 P60
	{% endfor %}
	{% for head in range(20, 0, -1) %}
	{% for j in range(1, 21) %}
	{% set dist = (head - j) if head >= j else (j - head) %}
	{% if dist == 0 %}
	SET_LED LED=board_neopixel INDEX={j} RED=1 GREEN=0 BLUE=0 TRANSMIT=0
	{% elif dist == 1 %}
	SET_LED LED=board_neopixel INDEX={j} RED=0.4 GREEN=0 BLUE=0 TRANSMIT=0
	{% elif dist == 2 %}
	SET_LED LED=board_neopixel INDEX={j} RED=0.1 GREEN=0 BLUE=0 TRANSMIT=0
	{% else %}
	SET_LED LED=board_neopixel INDEX={j} RED=0 GREEN=0 BLUE=0 TRANSMIT=0
	{% endif %}
	{% endfor %}
	SET_LED LED=board_neopixel INDEX=20 RED=0 GREEN=0 BLUE=0 TRANSMIT=1
	G4 P60
	{% endfor %}
	{% endfor %}
	SET_LED LED=board_neopixel RED=0.2 GREEN=0 BLUE=0
	{% endif %}

[gcode_macro LED_STROBE]
gcode = 
	{% if printer.print_stats.state != "printing" %}
	{% for i in range(15) %}
	SET_LED LED=board_neopixel RED=1 GREEN=1 BLUE=1
	G4 P50
	SET_LED LED=board_neopixel RED=0 GREEN=0 BLUE=0
	G4 P50
	{% endfor %}
	SET_LED LED=board_neopixel RED=0.3 GREEN=0.3 BLUE=0.3
	{% endif %}

[gcode_macro LED_WAVE]
gcode = 
	{% if printer.print_stats.state != "printing" %}
	{% set colors = [
	(1,0,0),(1,0.5,0),(1,1,0),(0,1,0),(0,1,1),(0,0,1),(0.5,0,1),(1,0,0.5)
	] %}
	{% for offset in range(24) %}
	{% for j in range(1, 21) %}
	{% set cidx = (j + offset) % 8 %}
	{% set c = colors[cidx] %}
	SET_LED LED=board_neopixel INDEX={j} RED={c[0]} GREEN={c[1]} BLUE={c[2]} TRANSMIT={(1 if j == 20 else 0)}
	{% endfor %}
	G4 P80
	{% endfor %}
	SET_LED LED=board_neopixel RED=0.3 GREEN=0.3 BLUE=0.3
	{% endif %}

[gcode_macro LED_PROGRESS]
gcode = 
	{% set pct = params.PCT|default(0)|float %}
	{% set lit = (pct / 100 * 20)|int %}
	{% for j in range(1, 21) %}
	{% if j <= lit %}
	SET_LED LED=board_neopixel INDEX={j} RED=1.0 GREEN=0.8 BLUE=0.0 TRANSMIT={(1 if j == 20 else 0)}
	{% elif j == lit + 1 %}
	SET_LED LED=board_neopixel INDEX={j} RED=1.0 GREEN=1.0 BLUE=1.0 TRANSMIT={(1 if j == 20 else 0)}
	{% else %}
	SET_LED LED=board_neopixel INDEX={j} RED=0 GREEN=0 BLUE=0.5 TRANSMIT={(1 if j == 20 else 0)}
	{% endif %}
	{% endfor %}

[gcode_macro _LED_PROGRESS_VARS]
variable_enabled = 0
gcode =

[delayed_gcode _LED_PROGRESS_LOOP]
gcode = 
	{% set vars = printer["gcode_macro _LED_PROGRESS_VARS"] %}
	{% if vars.enabled == 1 %}
	{% if printer.virtual_sdcard.is_active %}
	{% set pct = (printer.virtual_sdcard.progress * 100)|round(1) %}
	LED_PROGRESS PCT={pct}
	{% endif %}
	UPDATE_DELAYED_GCODE ID=_LED_PROGRESS_LOOP DURATION=30
	{% endif %}

[gcode_macro LED_PROGRESS_ON]
description = 印刷進捗をLEDバーで表示する
gcode = 
	SET_GCODE_VARIABLE MACRO=_LED_PROGRESS_VARS VARIABLE=enabled VALUE=1
	UPDATE_DELAYED_GCODE ID=_LED_PROGRESS_LOOP DURATION=1
	RESPOND MSG="進捗LED: ON"

[gcode_macro LED_PROGRESS_OFF]
description = 進捗LEDを停止して通常表示に戻す
gcode = 
	SET_GCODE_VARIABLE MACRO=_LED_PROGRESS_VARS VARIABLE=enabled VALUE=0
	UPDATE_DELAYED_GCODE ID=_LED_PROGRESS_LOOP DURATION=0
	SET_LED LED=board_neopixel RED=0.3 GREEN=0.3 BLUE=0.3
	RESPOND MSG="進捗LED: OFF"
