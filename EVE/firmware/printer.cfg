# EVE - Voron 0.2 Klipper Configuration
# MCU: BTT SKR Pico v1.0
# SBC: BTT Pi v1.2
# Toolhead: Dragonburner (dual 4010 blower + 2510 hotend fan)
# Hotend: Bambu Lab (bi-metal, ceramic heater, NTC 100K thermistor)
#
# Before printing: PID tune hotend and bed, calibrate Z offset,
# verify stepper directions, and check endstops.

[include macros.cfg]

# ==================== MCU ====================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_XXXXXXXXXXXXX-if00
# Run `ls /dev/serial/by-id/` on BTT Pi to find your MCU serial

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 45
square_corner_velocity: 6.0

# ==================== X/Y Stepper (A/B Motors) ====================

[stepper_x]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: ^gpio4
position_endstop: 120
position_max: 120
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
interpolate: False
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: ^gpio3
position_endstop: 120
position_max: 120
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
interpolate: False
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

# ==================== Z Stepper ====================

[stepper_z]
step_pin: gpio19
dir_pin: !gpio28
enable_pin: !gpio2
rotation_distance: 8
microsteps: 32
endstop_pin: ^gpio25
position_endstop: -0.10   # adjust after Z calibration
position_max: 120
position_min: -1.5
homing_speed: 10
second_homing_speed: 3.0
homing_retract_dist: 3.0

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
interpolate: False
run_current: 0.37
sense_resistor: 0.110
stealthchop_threshold: 0

# ==================== Extruder ====================

[extruder]
step_pin: gpio14
dir_pin: gpio13
enable_pin: !gpio15
rotation_distance: 22.23    # calibrate with your extruder
gear_ratio: 50:10            # adjust for CW2/Galileo2/Sherpa Mini
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
sensor_type: Generic 3950       # Bambu Lab NTC 100K thermistor
sensor_pin: gpio27
min_temp: 0
max_temp: 300                   # Bambu Lab bi-metal supports higher temps
min_extrude_temp: 170
max_extrude_only_distance: 150
max_extrude_cross_section: 0.8
pressure_advance: 0.0        # calibrate per filament
pressure_advance_smooth_time: 0.040

# PID tuning: PID_CALIBRATE HEATER=extruder TARGET=245
#control: pid
#pid_kp: 28.182
#pid_ki: 1.978
#pid_kd: 100.397

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
interpolate: False
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

# ==================== Bed Heater ====================

[heater_bed]
heater_pin: gpio21
sensor_type: Generic 3950
sensor_pin: gpio26
smooth_time: 3.0
min_temp: 0
max_temp: 120
# PID tuning: PID_CALIBRATE HEATER=heater_bed TARGET=100
#control: pid
#pid_kp: 68.453
#pid_ki: 2.749
#pid_kd: 426.122

# ==================== Fans (Dragonburner) ====================

# Hotend cooling fan - 2510 axial
[heater_fan hotend_fan]
pin: gpio18
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

# Part cooling fans - dual 4010 blowers wired in parallel to single output
[fan]
pin: gpio17
max_power: 1.0
kick_start_time: 0.5
off_below: 0.10
cycle_time: 0.010

# NOTE: Dragonburner uses 2x 4010 blower fans for part cooling.
# Wire both fans in parallel to the FAN0 output.
# This provides significantly more airflow than Mini Stealthburner.
# If running fans on separate outputs, use multi_pin:
#
# [multi_pin part_fan_pins]
# pins: gpio17, gpio20   # adjust second pin as needed
#
# [fan]
# pin: multi_pin:part_fan_pins
# max_power: 1.0
# kick_start_time: 0.5

# ==================== Temperature Sensors ====================

[temperature_sensor btt_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

# ==================== Homing & Leveling ====================

[safe_z_home]
home_xy_position: 120,120
speed: 50.0
z_hop: 5

[bed_screws]
screw1: 60,5
screw1_name: front screw
screw2: 5,115
screw2_name: back left
screw3: 115,115
screw3_name: back right

# ==================== Idle Timeout ====================

[idle_timeout]
timeout: 1800

# ==================== Input Shaper (optional) ====================

# Run SHAPER_CALIBRATE after installing ADXL345
#[input_shaper]
#shaper_freq_x: 0
#shaper_type_x: mzv
#shaper_freq_y: 0
#shaper_type_y: mzv

# ==================== ADXL345 via BTT Pi SPI (optional) ====================

# If using ADXL345 connected to BTT Pi GPIO:
#[mcu rpi]
#serial: /tmp/klipper_host_mcu
#
#[adxl345]
#cs_pin: rpi:None
#spi_bus: spidev0.0
