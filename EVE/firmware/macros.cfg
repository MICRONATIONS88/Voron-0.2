# EVE - Voron 0.2 Custom Macros

# ==================== Print Start / End ====================

[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    G90                  ; absolute positioning
    M107                 ; fan off
    M82                  ; absolute extruder mode

    # Heat bed
    M140 S{BED_TEMP}
    M190 S{BED_TEMP}

    # Home all axes
    G28

    # Heat extruder
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    # Purge line
    G92 E0
    G1 X5 Y5 Z0.3 F3000
    G1 X50 Y5 Z0.3 E10 F1500
    G1 X50 Y5.3 Z0.3 F3000
    G1 X5 Y5.3 Z0.3 E20 F1500
    G92 E0

[gcode_macro PRINT_END]
gcode:
    M400                 ; wait for buffer to clear
    G92 E0               ; zero the extruder
    G1 E-5.0 F1800       ; retract filament

    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    G91                  ; relative positioning
    G0 Z{z_safe} F600    ; move nozzle up
    G0 X60 Y60 F15000    ; park nozzle at rear

    TURN_OFF_HEATERS
    M107                 ; turn off fan
    G90                  ; absolute positioning
    M84                  ; disable steppers

# ==================== Utility Macros ====================

[gcode_macro CENTER]
description: Move toolhead to center of bed
gcode:
    G90
    G0 X60 Y60 Z30 F6000

[gcode_macro LOAD_FILAMENT]
description: Load filament into extruder
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    M300
    G91
    G92 E0
    G1 E50 F{max_velocity}
    G1 E25 F{speed}
    G92 E0
    G90

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from extruder
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    G91
    G92 E0
    G1 E5 F{speed}
    G1 E-50 F{max_velocity}
    G92 E0
    G90

[gcode_macro M600]
description: Filament change (pause)
gcode:
    PAUSE
    UNLOAD_FILAMENT

# ==================== Initial Setup Utilities ====================

[gcode_macro CHECK_STEPPERS]
description: Buzz each stepper to verify direction (run before first homing)
gcode:
    STEPPER_BUZZ STEPPER=stepper_x
    G4 P1000
    STEPPER_BUZZ STEPPER=stepper_y
    G4 P1000
    STEPPER_BUZZ STEPPER=stepper_z
    G4 P1000
    STEPPER_BUZZ STEPPER=extruder

[gcode_macro TEST_HEATERS]
description: Heat hotend to 150C and bed to 60C to verify heaters and thermistors
gcode:
    M140 S60               ; start heating bed
    M104 S150              ; start heating hotend
    M190 S60               ; wait for bed
    M109 S150              ; wait for hotend
    M117 Heater test OK!
    G4 P5000               ; hold 5 seconds
    TURN_OFF_HEATERS
    M117 Heaters cooled

[gcode_macro CHECK_ENDSTOPS]
description: Query all endstops and display status
gcode:
    QUERY_ENDSTOPS

# ==================== Cancel / Pause / Resume ====================

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set E = params.E|default(1.7)|float %}
    {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}

    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{E} F2100
    G1 Z{z_safe} F900
    G90
    G0 X{x_park} Y{y_park} F6000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set E = params.E|default(1.7)|float %}
    G91
    G1 E{E} F2100
    RESTORE_GCODE_STATE NAME=PAUSE_state
    BASE_RESUME
