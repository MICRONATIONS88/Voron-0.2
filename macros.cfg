# Print macros (ADAM)
# Brush, PRINT_START/END, filament, tuning, TMC monitoring, KAMP

[gcode_macro _MACRO_VARIABLES]
variable_park_x = 60
variable_park_y = 60
variable_park_z_hop = 10
variable_purge_len = 30
variable_load_len = 50
variable_unload_len = 60
variable_clean_x_start = 10
variable_clean_x_end = 50
variable_clean_y = 4
variable_clean_z = 1
variable_clean_wipes = 5
gcode =

[gcode_macro _TMC_GUARD_VARS]
variable_tracking_enabled = 0
variable_last_error = ''
gcode =

[gcode_macro TMC_STATUS]
description = Dump TMC driver status for X/Y/Z/extruder
gcode = 
	RESPOND TYPE=echo MSG="TMC STATUS: stepper_x"
	DUMP_TMC STEPPER=stepper_x
	RESPOND TYPE=echo MSG="TMC STATUS: stepper_y"
	DUMP_TMC STEPPER=stepper_y
	RESPOND TYPE=echo MSG="TMC STATUS: stepper_z"
	DUMP_TMC STEPPER=stepper_z
	RESPOND TYPE=echo MSG="TMC STATUS: extruder"
	DUMP_TMC STEPPER=extruder

[gcode_macro TMC_TRACK_START]
description = Start periodic TMC status logging during a print
gcode = 
	SET_GCODE_VARIABLE MACRO=_TMC_GUARD_VARS VARIABLE=tracking_enabled VALUE=1
	UPDATE_DELAYED_GCODE ID=_TMC_TRACK_LOOP DURATION=120

[gcode_macro TMC_TRACK_STOP]
description = Stop periodic TMC status logging
gcode = 
	SET_GCODE_VARIABLE MACRO=_TMC_GUARD_VARS VARIABLE=tracking_enabled VALUE=0
	UPDATE_DELAYED_GCODE ID=_TMC_TRACK_LOOP DURATION=0

[delayed_gcode _TMC_TRACK_LOOP]
initial_duration = 0
gcode = 
	{% if printer["gcode_macro _TMC_GUARD_VARS"].tracking_enabled|int == 1 %}
	RESPOND TYPE=echo MSG="TMC TRACK: polling X/Y/Z/E"
	DUMP_TMC STEPPER=stepper_x
	DUMP_TMC STEPPER=stepper_y
	DUMP_TMC STEPPER=stepper_z
	DUMP_TMC STEPPER=extruder
	UPDATE_DELAYED_GCODE ID=_TMC_TRACK_LOOP DURATION=120
	{% endif %}

[gcode_macro TMC_ERROR_PAUSE]
description = Pause print and report a TMC-related error
gcode = 
	{% set reason = params.REASON|default('TMC driver issue detected') %}
	SET_GCODE_VARIABLE MACRO=_TMC_GUARD_VARS VARIABLE=last_error VALUE='"{reason}"'
	RESPOND TYPE=error MSG="TMC ERROR: {reason}"
	PAUSE

[gcode_macro DEPLOY_BRUSH]
gcode:
  SET_SERVO SERVO=brush angle=89

[gcode_macro STOW_BRUSH]
gcode:
  SET_SERVO SERVO=brush angle=0
  G4 P500
  SET_SERVO SERVO=brush width=0

[gcode_macro BRUSH_NOZZLE_RESUME]
description: Clean nozzle on resume (no homing required)
gcode:
  G90
  {% set cur_z = printer.toolhead.position.z %}
  {% if cur_z < 12 %}
  G1 Z12 F1200
  {% endif %}
  DEPLOY_BRUSH
  G1 X0 Y118 F7800
  G4 P100
  {% for i in range(5) %}
  G1 X2 Y117 F3500
  G1 X2 Y119 F3500
  G1 X33 Y119 F3500
  G1 X33 Y117 F3500
  {% endfor %}
  G1 X2 Y117 F4000
  STOW_BRUSH

[gcode_macro BRUSH_NOZZLE]
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
  G28
  {% endif %}
  {% set current_z = printer.toolhead.position.z %}
  {% if current_z < 10 %}
    {% set z_raise = 10 - current_z %}
    G91 ; relative mode
    G1 Z{z_raise} F1200 ; raise Z to 10
    G90 ; back to absolute mode
  {% endif %}

  G90
  DEPLOY_BRUSH
  G1 Z10 X0 Y118 F7800
  G4 P100

  {% for i in range(8) %}
    G1 X2 Y117 F3500
    G1 X2 Y119 F3500
    G1 X33 Y119 F3500
    G1 X33 Y117 F3500
  {% endfor %}
  G1 X0 Y117 F4000
  G1 X0 Y60 F4000
  STOW_BRUSH

[gcode_macro BRUSH_NOZZLE_MANUAL]
gcode:
  CHOME
  {% set current_z = printer.toolhead.position.z %}
  {% if current_z < 10 %}
    {% set z_raise = 10 - current_z %}
    G91 ; relative mode
    G1 Z{z_raise} F1200 ; raise Z to 10
    G90 ; back to absolute mode
  {% endif %}
  
  FRONT_LEFT                                                         # If you want the printer to get to a certain temperature otherwise not needed
  G90
  M109 S225                                                          # Only needed if you use the brush nozzle macro without a print afterwards
  DEPLOY_BRUSH
  G1 Z10 X0 Y118 F7800
  G4 P100

  {% for i in range(8) %}
#    M104 S170                                                       # If needed you can let the temperature drop for a z-probe
    G1 X2 Y117 F3500
    G1 X2 Y119 F3500
    G1 X33 Y119 F3500
    G1 X33 Y117 F3500
  {% endfor %}
  G1 X2 Y117 F4000
  G1 X2 Y60 F4000
  STOW_BRUSH

[gcode_macro PRINT_START]
description = Heat, home, purge – then start print
gcode = 
	{% set BED_TEMP    = params.BED_TEMP|default(params.BED|default(100))|float %}
	{% set NOZZLE_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(250))|float %}
	{% set SOAK_TIME   = params.SOAK|default(0)|int %}
	
	LED_HEATING
	
	M117 Heating bed...
	M140 S{BED_TEMP}
	
	M190 S{BED_TEMP}
	{% if SOAK_TIME > 0 %}
	M117 Heat soaking {SOAK_TIME}s...
	G4 P{SOAK_TIME * 1000}
	{% endif %}
	
	M117 Homing...
	G28
	# CLEAN_NOZZLE
	# PLR_START
	G90
	
	
	
	M117 Parking...
	SMART_PARK
	
	M117 Heating nozzle...
	M109 S{NOZZLE_TEMP}
	
	M117 Cleaning nozzle...
	BRUSH_NOZZLE
	
	M117 Purging...
	LINE_PURGE
	
	LED_PRINTING
	LED_PROGRESS_ON
	
	
	
	
	_SET_TIMELAPSE_SETUP PARK_ENABLE=True PARK_POS=custom CUSTOM_POS_X=115 CUSTOM_POS_Y=115 CUSTOM_POS_DZ=2.0 TRAVEL_SPEED=400 RETRACT_SPEED=60 EXTRUDE_SPEED=45 RETRACT_DISTANCE=1.3 EXTRUDE_DISTANCE=1.3 FW_RETRACT=False
	
	
	M117 Printing...

[gcode_macro PRINT_END]
description = Retract, park head, turn off heaters, present bed
gcode = 
	TMC_TRACK_STOP
	{% set v = printer["gcode_macro _MACRO_VARIABLES"] %}
	{% set max_z = printer.toolhead.axis_maximum.z %}
	{% set cur_z = printer.toolhead.position.z %}
	{% set park_z = [cur_z + v.park_z_hop, max_z]|min %}
	
	LED_PROGRESS_OFF
	
	M400
	G92 E0
	G1 E-4 F3600
	G90
	G0 Z{park_z} F3600
	G0 X{v.park_x} Y{printer.toolhead.axis_maximum.y - 5} F6000
	
	PLR_CLEAR
	TURN_OFF_HEATERS
	M106.1 S0
	M107
	M84
	
	LED_DONE
	M73 P100
	M117 Print complete!

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos = True
variable_custom_park_x = 60.0
variable_custom_park_y = 115.0
variable_custom_park_dz = 10.0
variable_cancel_retract = 4.0
variable_speed_retract = 60.0
variable_user_cancel_macro = "_ON_CANCEL_PRINT"
variable_user_resume_macro = "BRUSH_NOZZLE_RESUME"
gcode =

[gcode_macro _ON_CANCEL_PRINT]
description = Helper executed on CANCEL_PRINT before Mainsail cancel base
gcode = 
	TMC_TRACK_STOP
	PLR_CLEAR
	TIMELAPSE_END
	M117 Cancelled

[gcode_macro M600]
description = Filament change – pause, unload, wait for user
gcode = 
	{% set X = params.X|default(printer["gcode_macro _MACRO_VARIABLES"].park_x)|float %}
	{% set Y = params.Y|default(printer["gcode_macro _MACRO_VARIABLES"].park_y)|float %}
	{% set Z = params.Z|default(10)|float %}
	SAVE_GCODE_STATE NAME=M600_STATE
	PAUSE
	G91
	G1 Z{Z} F3600
	G90
	G1 X{X} Y{Y} F6000
	UNLOAD_FILAMENT
	M117 Load filament then RESUME

[gcode_macro LOAD_FILAMENT]
description = Load filament – heat if needed, push through, purge
gcode = 
	{% set v = printer["gcode_macro _MACRO_VARIABLES"] %}
	{% set TEMP = params.TEMP|default(200)|float %}
	{% if printer.extruder.temperature < 180 %}
	M117 Heating extruder...
	M109 S{TEMP}
	{% endif %}
	M117 Loading...
	G91
	G1 E{v.load_len}  F300
	G1 E{v.purge_len} F150
	G90
	G92 E0
	M117 Load complete

[gcode_macro UNLOAD_FILAMENT]
description = Unload filament – heat if needed, retract
gcode = 
	{% set v = printer["gcode_macro _MACRO_VARIABLES"] %}
	{% set TEMP = params.TEMP|default(200)|float %}
	{% if printer.extruder.temperature < 180 %}
	M117 Heating extruder...
	M109 S{TEMP}
	{% endif %}
	M117 Unloading...
	G91
	G1 E5  F300
	G1 E-{v.unload_len} F600
	G90
	G92 E0
	M117 Unload complete

[gcode_macro PID_TUNE_HOTEND]
description = Run PID autotune for hotend. Usage: PID_TUNE_HOTEND TEMP=220
gcode = 
	{% set TEMP = params.TEMP|default(220)|float %}
	M117 PID tuning hotend at {TEMP}C...
	PID_CALIBRATE HEATER=extruder TARGET={TEMP}

[gcode_macro PID_TUNE_BED]
description = Run PID autotune for heated bed. Usage: PID_TUNE_BED TEMP=60
gcode = 
	{% set TEMP = params.TEMP|default(60)|float %}
	M117 PID tuning bed at {TEMP}C...
	PID_CALIBRATE HEATER=heater_bed TARGET={TEMP}

[gcode_macro HEATSOAK]
description = Heat bed to target and wait. Usage: HEATSOAK TEMP=110 MINUTES=15
gcode = 
	{% set TEMP    = params.TEMP|default(110)|float %}
	{% set MINUTES = params.MINUTES|default(10)|int %}
	M140 S{TEMP}
	M190 S{TEMP}
	M117 Soaking {MINUTES} min at {TEMP}C
	G4 P{MINUTES * 60 * 1000}
	M117 Soak done

[gcode_macro MESH_CALIBRATE]
description = Home, heat, then run bed mesh calibration
gcode = 
	{% set BED_TEMP = params.BED|default(60)|float %}
	G28
	M190 S{BED_TEMP}

[gcode_macro TEST_SPEED]
description = Stress-test XY motion to check for missed steps
gcode = 
	{% set SPEED      = params.SPEED|default(300)|int %}
	{% set ITERATIONS = params.ITERATIONS|default(5)|int %}
	{% set BOUND      = params.BOUND|default(5)|int %}
	{% set accel      = printer.toolhead.max_accel %}
	{% set xmin = printer.toolhead.axis_minimum.x + BOUND %}
	{% set xmax = printer.toolhead.axis_maximum.x - BOUND %}
	{% set ymin = printer.toolhead.axis_minimum.y + BOUND %}
	{% set ymax = printer.toolhead.axis_maximum.y - BOUND %}
	{% set fspeed = SPEED * 60 %}
	M117 Speed test {SPEED}mm/s x{ITERATIONS}
	SAVE_GCODE_STATE NAME=SPEED_TEST
	G28
	G90
	G0 X{xmin} Y{ymin} F{fspeed}
	{% for i in range(ITERATIONS) %}
	G0 X{xmax} Y{ymax} F{fspeed}
	G0 X{xmin} Y{ymin} F{fspeed}
	G0 X{xmax} Y{ymin} F{fspeed}
	G0 X{xmin} Y{ymax} F{fspeed}
	{% endfor %}
	G28
	RESTORE_GCODE_STATE NAME=SPEED_TEST
	M117 Speed test done

[gcode_macro PA_TUNE]
description = Print PA tower. Set NOZZLE/BED temps; tweak PA manually.
gcode = 
	{% set NOZZLE = params.NOZZLE|default(200)|float %}
	{% set BED    = params.BED|default(60)|float %}
	M117 PA Tune – heat up...
	M104 S{NOZZLE}
	M140 S{BED}
	G28
	M190 S{BED}
	M109 S{NOZZLE}
	SET_PRESSURE_ADVANCE ADVANCE=0
	TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=0.005
	M117 PA tower running – watch for best layer

[gcode_macro DUMP_VARIABLES]
description = Print all Klipper printer variables to console
gcode = 
	{% set ns  = namespace(output='') %}
	{% set filter_name  = params.NAME|default('')|lower %}
	{% set filter_value = params.VALUE|default('')|lower %}
	{% for name1 in printer %}
	{% if filter_name in name1|lower %}
	{% for name2 in printer[name1] %}
	{% set value = printer[name1][name2] %}
	{% if filter_value in value|string|lower %}
	{% set ns.output = ns.output ~ "printer['%s']['%s'] = %s\n" % (name1, name2, value) %}
	{% endif %}
	{% endfor %}
	{% endif %}
	{% endfor %}
	{ action_respond_info(ns.output) }

[gcode_macro GET_VARIABLE]
description = Print a single printer variable. Usage: GET_VARIABLE NAME=toolhead VALUE=position
gcode = 
	{% set name  = params.NAME  %}
	{% set value = params.VALUE %}
	{ action_respond_info("printer['%s']['%s'] = %s" % (name, value, printer[name][value])) }

[gcode_macro STATUS_READY]
gcode = 
	
	M117 Ready

[gcode_macro STATUS_PRINTING]
gcode = 
	
	M117 Printing

[gcode_macro STATUS_HEATING]
gcode = 
	
	M117 Heating

[gcode_macro T0]
gcode =

[gcode_macro M106]
rename_existing = M106.1
gcode = 
	{% set p = params.P|default(0)|int %}
	{% set s = params.S|default(255)|int %}
	{% if p == 0 %}
	M106.1 S{s}
	{% else %}
	{action_respond_info("M106: Ignored non-primary fan channel P" ~ p ~ " S" ~ s)}
	{% endif %}

[gcode_macro M107]
rename_existing = M107.1
gcode = 
	{% set p = params.P|default(0)|int %}
	{% if p == 0 %}
	M106.1 S0
	{% else %}
	{action_respond_info("M107: Ignored non-primary fan channel P" ~ p)}
	{% endif %}

[gcode_macro LINE_PURGE]
description = A purge macro that adapts to be near your actual printed objects
gcode = 
	
	{% set travel_speed = (printer.toolhead.max_velocity) * 60 | float %}
	{% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section | float %}
	
	
	{% if printer.firmware_retraction is defined %}
	{% set RETRACT = G10 | string %}
	{% set UNRETRACT = G11 | string %}
	{% else %}
	{% set RETRACT = 'G1 E-.5 F2100' | string %}
	{% set UNRETRACT = 'G1 E.5 F2100' | string %}
	{% endif %}
	
	
	{% set verbose_enable = printer["gcode_macro _KAMP_Settings"].verbose_enable | abs %}
	{% set purge_height = printer["gcode_macro _KAMP_Settings"].purge_height | float %}
	{% set tip_distance = printer["gcode_macro _KAMP_Settings"].tip_distance | float %}
	{% set purge_margin = printer["gcode_macro _KAMP_Settings"].purge_margin | float %}
	{% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}
	{% set flow_rate = printer["gcode_macro _KAMP_Settings"].flow_rate | float %}
	
	
	
	{% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
	{% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}
	{% set purge_x_max = (all_points | map(attribute=0) | max | default(0)) %}
	{% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}
	{% set purge_y_max = (all_points | map(attribute=1) | max | default(0)) %}
	
	{% set purge_x_center = ([((purge_x_max + purge_x_min) / 2) - (purge_amount / 2), 0] | max) %}
	{% set purge_y_center = ([((purge_y_max + purge_y_min) / 2) - (purge_amount / 2), 0] | max) %}
	
	{% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}
	{% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}
	
	
	{% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}
	
	{% if cross_section < 5 %}
	
	{action_respond_info("[Extruder] max_extrude_cross_section is insufficient for purge, please set it to 5 or greater. Purge skipped.")}
	
	{% else %}
	
	{% if verbose_enable == True %}
	
	{action_respond_info("Moving filament tip {}mms".format(
	(tip_distance),
	)) }
	{% endif %}
	
	{% if printer.firmware_retraction is defined %}
	{action_respond_info("KAMP purge is using firmware retraction.")}
	{% else %}
	{action_respond_info("KAMP purge is not using firmware retraction, it is recommended to configure it.")}
	{% endif %}
	
	SAVE_GCODE_STATE NAME=Prepurge_State
	
	{% if purge_y_origin > 0 %}
	
	G92 E0
	G0 F{travel_speed}
	G90
	G0 X{purge_x_center} Y{purge_y_origin}
	G0 Z{purge_height}
	M83
	G1 E{tip_distance} F{purge_move_speed}
	G1 X{purge_x_center + purge_amount} E{purge_amount} F{purge_move_speed}
	{RETRACT}
	G0 X{purge_x_center + purge_amount + 10} F{travel_speed}
	G92 E0
	M82
	G0 Z{purge_height * 2} F{travel_speed}
	
	{% else %}
	
	G92 E0
	G0 F{travel_speed}
	G90
	G0 X{purge_x_origin} Y{purge_y_center}
	G0 Z{purge_height}
	M83
	G1 E{tip_distance} F{purge_move_speed}
	G1 Y{purge_y_center + purge_amount} E{purge_amount} F{purge_move_speed}
	{RETRACT}
	G0 Y{purge_y_center + purge_amount + 10} F{travel_speed}
	G92 E0
	M82
	G0 Z{purge_height * 2} F{travel_speed}
	
	{% endif %}
	
	RESTORE_GCODE_STATE NAME=Prepurge_State
	
	{% endif %}

[gcode_macro SMART_PARK]
description = Parks your printhead near the print area for pre-print hotend heating.
gcode = 
	
	{% set kamp_settings = printer["gcode_macro _KAMP_Settings"] %}
	{% set z_height = kamp_settings.smart_park_height | float %}
	{% set purge_margin = kamp_settings.purge_margin | float %}
	{% set verbose_enable = kamp_settings.verbose_enable | abs %}
	{% set center_x = printer.toolhead.axis_maximum.x / 2 | float %}
	{% set center_y = printer.toolhead.axis_maximum.y / 2 | float %}
	{% set axis_minimum_x = printer.toolhead.axis_minimum.x | float %}
	{% set axis_minimum_y = printer.toolhead.axis_minimum.y | float %}
	{% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
	{% set x_min = all_points | map(attribute=0) | min | default(center_x) %}
	{% set y_min = all_points | map(attribute=1) | min | default(center_y) %}
	{% set travel_speed = (printer.toolhead.max_velocity) * 60 | float %}
	
	{% if purge_margin > 0 and x_min != center_x and y_min != center_y %}
	{% set x_min = [ x_min - purge_margin , x_min ] | min %}
	{% set y_min = [ y_min - purge_margin , y_min ] | min %}
	{% set x_min = [ x_min , axis_minimum_x ] | max %}
	{% set y_min = [ y_min , axis_minimum_y ] | max %}
	{% endif %}
	
	
	{% if verbose_enable == True %}
	
	{ action_respond_info("Smart Park location: {},{}.".format(
	(x_min),
	(y_min),
	)) }
	
	{% endif %}
	
	SAVE_GCODE_STATE NAME=Presmartpark_State
	
	G90
	{% if printer.toolhead.position.z < z_height %}
	G0 Z{z_height}
	{% endif %}
	G0 X{x_min} Y{y_min} F{travel_speed}
	G0 Z{z_height}
	
	RESTORE_GCODE_STATE NAME=Presmartpark_State

[gcode_macro _KAMP_Settings]
description = This macro contains all adjustable settings for KAMP
variable_verbose_enable = True
variable_mesh_margin = 0
variable_fuzz_amount = 0
variable_probe_dock_enable = False
variable_attach_macro = 'Attach_Probe'
variable_detach_macro = 'Dock_Probe'
variable_purge_height = 0.8
variable_tip_distance = 0
variable_purge_margin = 10
variable_purge_amount = 30
variable_flow_rate = 12
variable_smart_park_height = 10
gcode = 
	
	{action_respond_info(" Running the KAMP_Settings macro does nothing, it is only used for storing KAMP settings. ")}

[gcode_macro CALIBRATE_Z_ENDSTOP]
description: Start Z-Endstop Calibration (Paper Test)
gcode:
    G28
    Z_ENDSTOP_CALIBRATE

