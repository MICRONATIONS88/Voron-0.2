####################################################################
# Voron 0.2 – Popular Macros Collection
# Drop this file into ~/printer_data/config/ and add
#   [include macros.cfg]
# to the top of printer.cfg, then restart Klipper.
####################################################################

# ─────────────────────────────────────────────────────────────────
# Variable defaults – adjust to match your machine
# ─────────────────────────────────────────────────────────────────
[gcode_macro _MACRO_VARIABLES]
variable_park_x:          60     # X position for head park (mm)
variable_park_y:          60     # Y position for head park (mm)
variable_park_z_hop:      10     # Z lift when parking (mm)
variable_purge_len:       30     # Filament to purge on LOAD (mm)
variable_load_len:        50     # Filament to push on LOAD (mm)
variable_unload_len:      60     # Filament to retract on UNLOAD (mm)
variable_clean_x_start:   10     # Nozzle-wipe start X
variable_clean_x_end:     50     # Nozzle-wipe end X
variable_clean_y:          4     # Nozzle-wipe Y position
variable_clean_z:          1     # Nozzle-wipe Z height
variable_clean_wipes:      5     # Number of wipes
gcode:


# ─────────────────────────────────────────────────────────────────
# TMC tracking / error guard helpers
# ─────────────────────────────────────────────────────────────────
[gcode_macro _TMC_GUARD_VARS]
variable_tracking_enabled: 0
variable_last_error: ''
gcode:

[gcode_macro TMC_STATUS]
description: Dump TMC driver status for X/Y/Z/extruder
gcode:
    RESPOND TYPE=echo MSG="TMC STATUS: stepper_x"
    DUMP_TMC STEPPER=stepper_x
    RESPOND TYPE=echo MSG="TMC STATUS: stepper_y"
    DUMP_TMC STEPPER=stepper_y
    RESPOND TYPE=echo MSG="TMC STATUS: stepper_z"
    DUMP_TMC STEPPER=stepper_z
    RESPOND TYPE=echo MSG="TMC STATUS: extruder"
    DUMP_TMC STEPPER=extruder

[gcode_macro TMC_TRACK_START]
description: Start periodic TMC status logging during a print
gcode:
    SET_GCODE_VARIABLE MACRO=_TMC_GUARD_VARS VARIABLE=tracking_enabled VALUE=1
    UPDATE_DELAYED_GCODE ID=_TMC_TRACK_LOOP DURATION=30

[gcode_macro TMC_TRACK_STOP]
description: Stop periodic TMC status logging
gcode:
    SET_GCODE_VARIABLE MACRO=_TMC_GUARD_VARS VARIABLE=tracking_enabled VALUE=0
    UPDATE_DELAYED_GCODE ID=_TMC_TRACK_LOOP DURATION=0

[delayed_gcode _TMC_TRACK_LOOP]
initial_duration: 0
gcode:
    {% if printer["gcode_macro _TMC_GUARD_VARS"].tracking_enabled|int == 1 %}
        RESPOND TYPE=echo MSG="TMC TRACK: polling X/Y/Z/E"
        DUMP_TMC STEPPER=stepper_x
        DUMP_TMC STEPPER=stepper_y
        DUMP_TMC STEPPER=stepper_z
        DUMP_TMC STEPPER=extruder
        UPDATE_DELAYED_GCODE ID=_TMC_TRACK_LOOP DURATION=30
    {% endif %}

[gcode_macro TMC_ERROR_PAUSE]
description: Pause print and report a TMC-related error
gcode:
    {% set reason = params.REASON|default('TMC driver issue detected') %}
    SET_GCODE_VARIABLE MACRO=_TMC_GUARD_VARS VARIABLE=last_error VALUE='"{reason}"'
    RESPOND TYPE=error MSG="TMC ERROR: {reason}"
    PAUSE

# ─────────────────────────────────────────────────────────────────
# PRINT_START
# Usage in slicer: PRINT_START BED=[bed_temperature] EXTRUDER=[nozzle_temperature]
# ─────────────────────────────────────────────────────────────────
[gcode_macro PRINT_START]
description: Heat, home, purge – then start print
gcode:
    {% set BED_TEMP    = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set NOZZLE_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(200))|float %}
    {% set SOAK_TIME   = params.SOAK|default(0)|int %}   # optional heat-soak seconds

    LED_HEATING
    M117 Heating bed...
    M140 S{BED_TEMP}                      # start bed heat (non-blocking)

    M190 S{BED_TEMP}                      # wait for bed
    {% if SOAK_TIME > 0 %}
        M117 Heat soaking {SOAK_TIME}s...
        G4 P{SOAK_TIME * 1000}
    {% endif %}

    M117 Homing...
    G28                                    # full home
    PLR_START                              # PLR自動保存開始
    G90                                    # absolute positioning

    # BED_MESH_CALIBRATE                  # disabled – [bed_mesh] / probe not configured

    M117 Parking...
    SMART_PARK                             # KAMPのスマートパーク（印刷物の近くで待機）

    M117 Heating nozzle...
    M109 S{NOZZLE_TEMP}                   # wait for nozzle

    M117 Purging...
    LINE_PURGE                             # KAMPのアダプティブ・ラインパージ

    LED_PRINTING
    LED_PROGRESS_ON
    # Configure timelapse settings to prevent stringing:
    # Park head at back-right (X120 Y120), travel fast (200mm/s), retract 2.5mm at 40mm/s with a 1.0mm Z-hop
    _SET_TIMELAPSE_SETUP PARK_ENABLE=True PARK_POS=custom CUSTOM_POS_X=120 CUSTOM_POS_Y=120 CUSTOM_POS_DZ=1.0 TRAVEL_SPEED=400 RETRACT_SPEED=50 EXTRUDE_SPEED=40 RETRACT_DISTANCE=1.5 EXTRUDE_DISTANCE=1.5 FW_RETRACT=False
    # TIMELAPSE_START
    M117 Printing...


[gcode_macro _PURGE_LINE]
description: Draw a short purge line along the left edge of the bed
gcode:
    {% set travel_speed = 6000 %}
    {% set purge_speed  = 300 %}
    G90
    G1 X2 Y10 Z0.3 F{travel_speed}
    G91
    G1 E8 F{purge_speed}                  # prime
    G1 Y50 E10 F{purge_speed}             # draw line
    G1 Y5 E-0.5 F{travel_speed}           # retract & move off
    G90
    G1 Z2 F3000


# ─────────────────────────────────────────────────────────────────
# PRINT_END
# ─────────────────────────────────────────────────────────────────
[gcode_macro PRINT_END]
description: Retract, park head, turn off heaters, present bed
gcode:
    {% set v = printer["gcode_macro _MACRO_VARIABLES"] %}
    {% set max_z = printer.toolhead.axis_maximum.z %}
    {% set cur_z = printer.toolhead.position.z %}
    {% set park_z = [cur_z + v.park_z_hop, max_z]|min %}

    LED_PROGRESS_OFF
    #TIMELAPSE_END
    M400                                   # wait for moves to finish
    G92 E0
    G1 E-4 F3600                           # retract
    G90
    G0 Z{park_z} F3600                     # safe absolute Z-hop
    G0 X{v.park_x} Y{printer.toolhead.axis_maximum.y - 5} F6000   # park rear

    PLR_CLEAR                              # PLRデータクリア
    TURN_OFF_HEATERS
    M107                                   # fan off
    M84                                    # motors off
    
    LED_DONE
    M73 P100                               # set progress to 100%
    M117 Print complete!


# ─────────────────────────────────────────────────────────────────
# PAUSE / RESUME / CANCEL_PRINT
# ─────────────────────────────────────────────────────────────────
[gcode_macro PAUSE]
description: Pause print and park head
rename_existing: PAUSE_BASE
gcode:
    {% set v = printer["gcode_macro _MACRO_VARIABLES"] %}
    {% set E = params.E|default(1.7)|float %}
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude %}
        G1 E-{E} F2100
    {% endif %}
    {% if printer.toolhead.position.z < printer.toolhead.axis_maximum.z - v.park_z_hop %}
        G1 Z{v.park_z_hop}
    {% endif %}
    G90
    G1 X{v.park_x} Y{v.park_y} F6000
    M117 Paused


[gcode_macro RESUME]
description: Resume print from pause position
rename_existing: RESUME_BASE
gcode:
    {% set E = params.E|default(1.7)|float %}
    {% if printer.extruder.can_extrude %}
        G91
        G1 E{E} F2100
        G90
    {% endif %}
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=100
    RESUME_BASE
    M117 Printing...


[gcode_macro CANCEL_PRINT]
description: Cancel the running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set v = printer["gcode_macro _MACRO_VARIABLES"] %}
    PLR_CLEAR                              # PLRデータクリア
    TURN_OFF_HEATERS
    M107
    G91
    G1 Z{v.park_z_hop} F3600
    G90
    G0 X{v.park_x} Y{printer.toolhead.axis_maximum.y - 5} F6000
    M84
    BED_MESH_CLEAR
    CANCEL_PRINT_BASE
    M117 Cancelled


# ─────────────────────────────────────────────────────────────────
# M600 – Filament Change
# ─────────────────────────────────────────────────────────────────
[gcode_macro M600]
description: Filament change – pause, unload, wait for user
gcode:
    {% set X = params.X|default(printer["gcode_macro _MACRO_VARIABLES"].park_x)|float %}
    {% set Y = params.Y|default(printer["gcode_macro _MACRO_VARIABLES"].park_y)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_STATE
    PAUSE
    G91
    G1 Z{Z} F3600
    G90
    G1 X{X} Y{Y} F6000
    UNLOAD_FILAMENT
    M117 Load filament then RESUME


# ─────────────────────────────────────────────────────────────────
# LOAD_FILAMENT / UNLOAD_FILAMENT
# ─────────────────────────────────────────────────────────────────
[gcode_macro LOAD_FILAMENT]
description: Load filament – heat if needed, push through, purge
gcode:
    {% set v = printer["gcode_macro _MACRO_VARIABLES"] %}
    {% set TEMP = params.TEMP|default(200)|float %}
    {% if printer.extruder.temperature < 180 %}
        M117 Heating extruder...
        M109 S{TEMP}
    {% endif %}
    M117 Loading...
    G91
    G1 E{v.load_len}  F300
    G1 E{v.purge_len} F150
    G90
    G92 E0
    M117 Load complete


[gcode_macro UNLOAD_FILAMENT]
description: Unload filament – heat if needed, retract
gcode:
    {% set v = printer["gcode_macro _MACRO_VARIABLES"] %}
    {% set TEMP = params.TEMP|default(200)|float %}
    {% if printer.extruder.temperature < 180 %}
        M117 Heating extruder...
        M109 S{TEMP}
    {% endif %}
    M117 Unloading...
    G91
    G1 E5  F300     # small prime to break tip
    G1 E-{v.unload_len} F600
    G90
    G92 E0
    M117 Unload complete


# ─────────────────────────────────────────────────────────────────
# CLEAN_NOZZLE
# ─────────────────────────────────────────────────────────────────
[gcode_macro CLEAN_NOZZLE]
description: Wipe nozzle on brush (configure positions in _MACRO_VARIABLES)
gcode:
    {% set v = printer["gcode_macro _MACRO_VARIABLES"] %}
    {% set wipes = v.clean_wipes %}
    G90
    G1 X{v.clean_x_start} Y{v.clean_y} Z{v.clean_z + 10} F6000
    G1 Z{v.clean_z} F3000
    {% for i in range(wipes) %}
        G1 X{v.clean_x_end} F8000
        G1 X{v.clean_x_start} F8000
    {% endfor %}
    G1 Z5 F3000
    M117 Nozzle clean


# ─────────────────────────────────────────────────────────────────
# PID tuning helpers
# ─────────────────────────────────────────────────────────────────
[gcode_macro PID_TUNE_HOTEND]
description: Run PID autotune for hotend. Usage: PID_TUNE_HOTEND TEMP=220
gcode:
    {% set TEMP = params.TEMP|default(220)|float %}
    M117 PID tuning hotend at {TEMP}C...
    PID_CALIBRATE HEATER=extruder TARGET={TEMP}

[gcode_macro PID_TUNE_BED]
description: Run PID autotune for heated bed. Usage: PID_TUNE_BED TEMP=60
gcode:
    {% set TEMP = params.TEMP|default(60)|float %}
    M117 PID tuning bed at {TEMP}C...
    PID_CALIBRATE HEATER=heater_bed TARGET={TEMP}


# ─────────────────────────────────────────────────────────────────
# HEATSOAK
# ─────────────────────────────────────────────────────────────────
[gcode_macro HEATSOAK]
description: Heat bed to target and wait. Usage: HEATSOAK TEMP=110 MINUTES=15
gcode:
    {% set TEMP    = params.TEMP|default(110)|float %}
    {% set MINUTES = params.MINUTES|default(10)|int %}
    M140 S{TEMP}
    M190 S{TEMP}
    M117 Soaking {MINUTES} min at {TEMP}C
    G4 P{MINUTES * 60 * 1000}
    M117 Soak done


# ─────────────────────────────────────────────────────────────────
# BED_MESH_CALIBRATE wrapper
# (requires [bed_mesh] and a probe – enable when probe is installed)
# ─────────────────────────────────────────────────────────────────
[gcode_macro MESH_CALIBRATE]
description: Home, heat, then run bed mesh calibration
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    G28
    M190 S{BED_TEMP}
    # BED_MESH_CALIBRATE                  # disabled – probe not configured
    # BED_MESH_PROFILE SAVE=default       # disabled – probe not configured
    # SAVE_CONFIG                         # disabled – probe not configured


# ─────────────────────────────────────────────────────────────────
# TEST_SPEED – CoreXY speed / ringing test
# Usage: TEST_SPEED SPEED=300 ITERATIONS=5
# ─────────────────────────────────────────────────────────────────
[gcode_macro TEST_SPEED]
description: Stress-test XY motion to check for missed steps
gcode:
    {% set SPEED      = params.SPEED|default(300)|int %}
    {% set ITERATIONS = params.ITERATIONS|default(5)|int %}
    {% set BOUND      = params.BOUND|default(5)|int %}
    {% set accel      = printer.toolhead.max_accel %}
    {% set xmin = printer.toolhead.axis_minimum.x + BOUND %}
    {% set xmax = printer.toolhead.axis_maximum.x - BOUND %}
    {% set ymin = printer.toolhead.axis_minimum.y + BOUND %}
    {% set ymax = printer.toolhead.axis_maximum.y - BOUND %}
    {% set fspeed = SPEED * 60 %}
    M117 Speed test {SPEED}mm/s x{ITERATIONS}
    SAVE_GCODE_STATE NAME=SPEED_TEST
    G28
    G90
    G0 X{xmin} Y{ymin} F{fspeed}
    {% for i in range(ITERATIONS) %}
        G0 X{xmax} Y{ymax} F{fspeed}
        G0 X{xmin} Y{ymin} F{fspeed}
        G0 X{xmax} Y{ymin} F{fspeed}
        G0 X{xmin} Y{ymax} F{fspeed}
    {% endfor %}
    G28
    RESTORE_GCODE_STATE NAME=SPEED_TEST
    M117 Speed test done


# ─────────────────────────────────────────────────────────────────
# PA_TUNE – Pressure Advance calibration helper
# ─────────────────────────────────────────────────────────────────
[gcode_macro PA_TUNE]
description: Print PA tower. Set NOZZLE/BED temps; tweak PA manually.
gcode:
    {% set NOZZLE = params.NOZZLE|default(200)|float %}
    {% set BED    = params.BED|default(60)|float %}
    M117 PA Tune – heat up...
    M104 S{NOZZLE}
    M140 S{BED}
    G28
    M190 S{BED}
    M109 S{NOZZLE}
    SET_PRESSURE_ADVANCE ADVANCE=0
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=0.005
    M117 PA tower running – watch for best layer


# ─────────────────────────────────────────────────────────────────
# Debug helpers
# ─────────────────────────────────────────────────────────────────
[gcode_macro DUMP_VARIABLES]
description: Print all Klipper printer variables to console
gcode:
    {% set ns  = namespace(output='') %}
    {% set filter_name  = params.NAME|default('')|lower %}
    {% set filter_value = params.VALUE|default('')|lower %}
    {% for name1 in printer %}
        {% if filter_name in name1|lower %}
            {% for name2 in printer[name1] %}
                {% set value = printer[name1][name2] %}
                {% if filter_value in value|string|lower %}
                    {% set ns.output = ns.output ~ "printer['%s']['%s'] = %s\n" % (name1, name2, value) %}
                {% endif %}
            {% endfor %}
        {% endif %}
    {% endfor %}
    { action_respond_info(ns.output) }


[gcode_macro GET_VARIABLE]
description: Print a single printer variable. Usage: GET_VARIABLE NAME=toolhead VALUE=position
gcode:
    {% set name  = params.NAME  %}
    {% set value = params.VALUE %}
    { action_respond_info("printer['%s']['%s'] = %s" % (name, value, printer[name][value])) }


# ─────────────────────────────────────────────────────────────────
# STATUS LED helpers (comment out if no LEDs)
# ─────────────────────────────────────────────────────────────────
[gcode_macro STATUS_READY]
gcode:
    # SET_LED LED=neopixel RED=0.0 GREEN=0.5 BLUE=1.0  # uncomment if LED configured
    M117 Ready

[gcode_macro STATUS_PRINTING]
gcode:
    # SET_LED LED=neopixel RED=1.0 GREEN=0.4 BLUE=0.0
    M117 Printing

[gcode_macro STATUS_HEATING]
gcode:
    # SET_LED LED=neopixel RED=1.0 GREEN=0.0 BLUE=0.0
    M117 Heating

# ─────────────────────────────────────────────────────────────────
# T0 dummy macro to prevent "Unknown command: T0" error
# ─────────────────────────────────────────────────────────────────
[gcode_macro T0]
gcode:
    # Do nothing, single extruder machine.


# ─────────────────────────────────────────────────────────────────
# M106 / M107 Multi-Fan override to prevent slicer auxiliary fan commands from starting part cooling fan
# ─────────────────────────────────────────────────────────────────
[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% set p = params.P|default(0)|int %}
    {% if p == 0 %}
        {% if params.S is defined %}
            M106.1 S{params.S}
        {% else %}
            M106.1
        {% endif %}
    {% else %}
        {action_respond_info("M106: Ignored auxiliary fan channel P" ~ p ~ " S" ~ params.S|default(255))}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
    {% set p = params.P|default(0)|int %}
    {% if p == 0 %}
        M107.1
    {% else %}
        {action_respond_info("M107: Ignored auxiliary fan channel P" ~ p)}
    {% endif %}
