# ADAM (Voron 0.2) - printer.cfg
# Hardware configuration only.
# Macros and features are in separate included files.

[include mainsail.cfg]
[include timelapse.cfg]
[include plr.cfg]
[include leds.cfg]
[include macros.cfg]
[include camera_macros.cfg]

[servo brush]
pin: gpio24         #This is the pin to which you connected your servo                        
minimum_pulse_width: 0.000444
maximum_pulse_width: 0.002488
# initial_angle: 0 -> via startup macro
maximum_servo_angle: 180

[include ebb36.cfg]

[mcu]
serial = /dev/ttyAMA0
restart_method = command

[printer]
kinematics = corexy
max_velocity = 500
max_accel = 8500
max_z_velocity = 15
max_z_accel = 45
square_corner_velocity = 8.0
minimum_cruise_ratio = 0.5

[bed_screws]
screw1 = 60,5
screw1_name = Front Center
screw2 = 5,115
screw2_name = Back Left
screw3 = 115,115
screw3_name = Back Right

[stepper_x]
step_pin = gpio11
dir_pin = !gpio10
enable_pin = !gpio12
microsteps = 16
rotation_distance = 40
endstop_pin = tmc2209_stepper_x:virtual_endstop
position_endstop = 120
position_max = 120
position_min = -1.5
homing_speed = 40
homing_retract_dist = 0
homing_positive_dir = true

[tmc2209 stepper_x]
uart_pin = gpio9
tx_pin = gpio8
uart_address = 0
diag_pin = ^gpio4
run_current = 0.800
interpolate = False
stealthchop_threshold = 0
driver_sgthrs = 80

[stepper_y]
step_pin = gpio6
dir_pin = !gpio5
enable_pin = !gpio7
microsteps = 16
rotation_distance = 40
endstop_pin = tmc2209_stepper_y:virtual_endstop
position_endstop = 120
position_max = 120
position_min = -1.5
homing_speed = 40
homing_retract_dist = 0
homing_positive_dir = true

[tmc2209 stepper_y]
uart_pin = gpio9
tx_pin = gpio8
uart_address = 2
diag_pin = ^gpio3
run_current = 0.8
interpolate = False
stealthchop_threshold = 0
driver_sgthrs = 80

[stepper_z]
step_pin = gpio19
dir_pin = !gpio28
enable_pin = !gpio2
microsteps = 16
rotation_distance = 8
endstop_pin = ^gpio25
position_max = 130
position_min = -10
homing_speed = 20
second_homing_speed = 10.0
homing_retract_dist = 3.0
#position_endstop = 119.085

[tmc2209 stepper_z]
uart_pin = gpio9
tx_pin = gpio8
uart_address = 1
run_current = 0.580
interpolate = False
stealthchop_threshold = 0

