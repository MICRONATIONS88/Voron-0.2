[heater_bed]
heater_pin = gpio21
sensor_type = NTC 100K MGB18-104F39050L32
sensor_pin = gpio26
smooth_time = 3.0
max_power = 1.0
min_temp = 10
max_temp = 120
control = pid
pid_kp = 45.429
pid_ki = 1.273
pid_kd = 405.454

[verify_heater extruder]
max_error = 400
check_gain_time = 120
hysteresis = 10
heating_gain = 1

[verify_heater heater_bed]
max_error = 240
check_gain_time = 60
hysteresis = 10
heating_gain = 1

