[include timelapse.cfg]
[include plr.cfg]
[include mainsail.cfg]
[include macros.cfg]
[include leds.cfg]
[include shell_command.cfg]
[include KAMP_Settings.cfg]
[include camera_macros.cfg]

# ===========================================================
# MCU & Printer Settings
# ===========================================================

[mcu]
serial: /dev/serial0
restart_method: command

[mcu EBBCan]
# U2C経由のCAN接続用UUID
canbus_uuid: 5d095814ee1b

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 15
max_z_accel: 45
minimum_cruise_ratio: 0.500
square_corner_velocity: 8.0

# ===========================================================
# X/Y Stepper Settings (Sensorless Homing)
# ===========================================================

[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.6
diag_pin: ^gpio4
driver_SGTHRS: 50
stealthchop_threshold: 0

[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.6
diag_pin: ^gpio3
driver_SGTHRS: 50
stealthchop_threshold: 0
# ===========================================================
# Z Stepper Settings
# ===========================================================

[stepper_z]
step_pin: gpio19
dir_pin: !gpio28
enable_pin: !gpio2
microsteps: 32
rotation_distance: 8
endstop_pin: ^gpio25
#position_endstop: 120
position_max: 120
homing_speed: 20


[homing_override]
axes: xyz
set_position_z: 0
gcode:
   G90
   G0 Z15 F600                             ; 安全上昇
   {% if "x" not in (printer.toolhead.homed_axes | lower) %}
      G28 X
   {% endif %}
   {% if "y" not in (printer.toolhead.homed_axes | lower) %}
      G28 Y
   {% endif %}
   G28 Z
   G0 Z30 F1800                           ; Z=30 定位置パーキング
   G0 X60 Y60 F6000                       ; 中央へ移動

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.6
stealthchop_threshold: 999999

# ===========================================================
# Extruder (EBB36) - 元の設定値を反映
# ===========================================================

[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
rotation_distance: 22.23 
gear_ratio: 50:10 
microsteps: 32
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 2.0
max_extrude_only_distance: 150.0  # UNLOAD_FILAMENTマクロ等の長いリトラクト(60mm)時のエラー回避用
heater_pin: EBBCan: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan: PA3
control: pid
pid_Kp: 26.689
pid_Ki: 2.766
pid_Kd: 64.385370
min_temp: 0
max_temp: 370
pressure_advance: 0.04        # ギアード押出機PLA開始値 (要調整)
pressure_advance_smooth_time: 0.04

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.8
stealthchop_threshold: 0  # ギアード押出機での脱調（ステップロス）やモーター加熱を防ぐため、StealthChopを無効化 (SpreadCycle有効化)

# ===========================================================
# Fans & Bed
# ===========================================================

[fan] # Part Cooling Fan (EBB36)
pin: EBBCan: PA1

[heater_fan hotend_fan] # Hotend Fan (EBB36)
pin: EBBCan: PA0
heater: extruder
heater_temp: 50.0

[heater_bed]
heater_pin: gpio21        # 'pin:' から 'heater_pin:' に修正
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: gpio26
max_power: 1.0
control: pid
pid_Kp: 63.153
pid_Ki: 2.506
pid_Kd: 397.864
min_temp: 0
max_temp: 110


[verify_heater extruder]
max_error: 400        # デフォルト120 → 大きいほど寛容
check_gain_time: 120   # デフォルト20秒 → 昇温確認の猶予時間
hysteresis: 10        # デフォルト5℃ → 許容温度誤差（℃）
heating_gain: 1       # 1秒あたりの最低昇温量（℃）

[verify_heater heater_bed]
max_error: 240
check_gain_time: 60
hysteresis: 10
heating_gain: 2

# ===========================================================
# LED Control (Neopixel)
# ===========================================================

[neopixel board_neopixel]
pin: gpio24
chain_count: 20
color_order: GRB
initial_RED: 0.1
initial_GREEN: 0.1
initial_BLUE: 0.1

# ===========================================================
# ADXL345 (加速度センサー) & Input Shaper
# ===========================================================

[adxl345]
cs_pin: EBBCan: PB12
spi_software_sclk_pin: EBBCan: PB10
spi_software_mosi_pin: EBBCan: PB11
spi_software_miso_pin: EBBCan: PB2
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
probe_points:
    60, 60, 20  # Voron 0.2のベッド中央付近でテストを実行

# ===========================================================
# 運用マクロ (前回の設定を完全移植)
# ===========================================================

[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(200))|float %}
    M117 Heating bed (Fast)...
    # 1. ベッドの加熱開始（出力1.0）
    M140 S{BED_TEMP}
    
    # 2. 最も時間がかかる「最後の3度」の手前まで急速温調（ノズルはまだ冷えた状態）
    {% if BED_TEMP > 40 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 3}
    {% else %}
        M190 S{BED_TEMP}
    {% endif %}
    
    # 3. ベッドがほぼ温まったら（PID制御に入り消費電力が下がったら）、ノズル加熱を開始
    M117 Heating nozzle...
    M104 S{EXTRUDER_TEMP}
    
    # 4. ノズル加熱と並行してホーミングを実行し、待ち時間を節約
    M117 Homing...
    G28
    
    # 5. ノズルが印刷温度に達するのを待機
    M117 Final nozzle heat...
    M109 S{EXTRUDER_TEMP}
    
    # 6. ベッドが完全に目標温度に達するのを最終確認（通常はホーミング中に到達済み）
    M190 S{BED_TEMP}
    
    # 7. パージして印刷開始
    _PURGE_LINE
    CLEAR_PRINT_PROGRESS
    PLR_START                              # PLR自動保存開始
    # タイムラプス設定
    _SET_TIMELAPSE_SETUP ENABLE=False PARK_ENABLE=False PARK_POS=custom CUSTOM_POS_X=120 CUSTOM_POS_Y=120 CUSTOM_POS_DZ=2.0 TRAVEL_SPEED=400 RETRACT_SPEED=60 EXTRUDE_SPEED=45 RETRACT_DISTANCE=0.5 EXTRUDE_DISTANCE=0.5 FW_RETRACT=False
    M117 Printing...

[gcode_macro PRINT_END]
gcode:
    TMC_TRACK_STOP
    M400
    G92 E0
    G1 E-2 F300
    G91
    G1 Z5 F3000
    G90
    G1 X110 Y110 F5000
    M104 S0
    M140 S0
    M106 S0
    M84
    PLR_CLEAR                               # PLR自動保存停止
    CLEAR_PRINT_PROGRESS
    TIMELAPSE_END
    M117 Finished

[gcode_macro _PURGE_LINE]
gcode:
    G90
    G1 X5 Y4 Z0.2 F3000
    G1 X5 Y50 E10 F1000
    G92 E0

[gcode_macro CLEAN_NOZZLE]
gcode:
    G90
    G1 X10 Y4 Z5 F5000
    {% for i in range(5) %}
        G1 X50 F5000
        G1 X10 F5000
    {% endfor %}

[temperature_sensor EBB36_temp]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

[temperature_sensor SKR_Pico_temp]
sensor_type: temperature_mcu

[bed_screws]
# Voron 0.2の120x120ベッドを想定した位置
screw1: 60, 5
screw1_name: front screw
screw2: 5, 115
screw2_name: back left
screw3: 115, 115
screw3_name: back right

[gcode_macro BED_LEVEL_ASSIST]
description: 手動ベッドレベリングを補助するために各ネジ位置へ移動します
gcode:
    G28 ; ホーミング[cite: 2]
    BED_SCREWS_ADJUST ; レベリングモード開始

[gcode_macro G32]
# Voronの標準的な準備マクロ
gcode:
    G28
    # 必要に応じて、ここでノズルクリーニングなどを追加

[exclude_object]

[gcode_macro PRESSURE_ADVANCE_TEST]
gcode:
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
  TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.005

[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 75.6
#shaper_type_y: mzv
#shaper_freq_y: 80.4

[gcode_arcs]
resolution: 0.1

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos  : True   ; カスタムパーク位置を使用
variable_custom_park_x   : 110.0  ; パーク X (後ろ右)
variable_custom_park_y   : 110.0  ; パーク Y (後ろ右)
variable_custom_park_dz  : 2.0    ; Zホップ量 [mm]
variable_retract         : 0.5    ; PAUSE時リトラクト [mm] (default:1.0→0.5)
variable_cancel_retract  : 2.0    ; CANCEL時リトラクト [mm] (default:5.0→2.0)
variable_speed_retract   : 50.0   ; リトラクト速度 [mm/s] (default:35→50)
variable_unretract       : 0.5    ; RESUME時デリトラクト [mm] (default:1.0→0.5)
variable_speed_unretract : 45.0   ; デリトラクト速度 [mm/s] (default:35→45)
variable_speed_hop       : 20.0   ; Zホップ速度 [mm/s]
variable_speed_move      : 200.0  ; パーク移動速度 [mm/s] (default:100→200)
gcode:


[firmware_retraction]
retract_length: 0.5    # 0.8→0.5mm: ギアード押出機最適値
retract_speed: 50      # 40→50mm/s
unretract_extra_length: 0
unretract_speed: 40

# ===========================================================
# 変数保存（印刷再開機能用）
# ===========================================================

[save_variables]
filename: /home/adam/printer_data/config/variables.cfg

# ===========================================================
# 印刷再開マクロ
# ===========================================================

[gcode_macro SAVE_PRINT_PROGRESS]
description: 現在の印刷進捗を保存（変化した値のみ書き込み）
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set z = printer.toolhead.position.z|round(2) %}
    {% set bed_temp = printer.heater_bed.target|float %}
    {% set extruder_temp = printer.extruder.target|float %}
    {% set filename = printer.print_stats.filename %}
    {% if svv.resume_bed_temp|default(-1)|float != bed_temp %}
        SAVE_VARIABLE VARIABLE=resume_bed_temp VALUE={bed_temp}
    {% endif %}
    {% if svv.resume_extruder_temp|default(-1)|float != extruder_temp %}
        SAVE_VARIABLE VARIABLE=resume_extruder_temp VALUE={extruder_temp}
    {% endif %}
    {% if svv.resume_filename|default('') != filename %}
        SAVE_VARIABLE VARIABLE=resume_filename VALUE='"{filename}"'
    {% endif %}
    {% if svv.resume_valid|default(0)|int != 1 %}
        SAVE_VARIABLE VARIABLE=resume_valid VALUE=1
    {% endif %}
    {% if svv.resume_z|default(-1)|float != z %}
        SAVE_VARIABLE VARIABLE=resume_z VALUE={z}
    {% endif %}

[gcode_macro RESUME_PRINT]
description: エラー・電源喪失後に保存された位置から印刷を再開する
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.resume_valid|default(0)|int == 0 %}
        RESPOND TYPE=error MSG="No saved progress found. Run SAVE_PRINT_PROGRESS during a print first."
    {% else %}
        {% set z = svv.resume_z|float %}
        {% set bed_temp = svv.resume_bed_temp|default(60)|float %}
        {% set extruder_temp = svv.resume_extruder_temp|default(200)|float %}
        RESPOND MSG="Resuming print: Z={z}mm Bed={bed_temp}C Ext={extruder_temp}C"
        M117 Resuming at Z={z}mm...
        ; --- Step 1: 加熱開始 ---
        M140 S{bed_temp}
        M104 S150
        ; --- Step 2: ホーミング ---
        G28
        ; --- Step 3: 温度待機 ---
        M190 S{bed_temp}
        M109 S{extruder_temp}
        ; --- Step 4: 再開位置の上へ移動 ---
        G90
        G1 X60 Y60 F6000
        G1 Z{z + 5.0} F1500
        ; --- Step 5: 少量パージ ---
        G92 E0
        G1 E5 F200
        G92 E0
        ; --- Step 6: 保存されたZ位置へ ---
        G1 Z{z} F600
        RESPOND MSG="At resume position Z={z}mm. Start your print from the saved layer."
        M117 Ready! Resume from saved layer.
    {% endif %}

[gcode_macro CLEAR_PRINT_PROGRESS]
description: 保存された印刷進捗をクリアする
gcode:
    SAVE_VARIABLE VARIABLE=resume_valid VALUE=0
    SAVE_VARIABLE VARIABLE=resume_z VALUE=0
    RESPOND MSG="Saved print progress cleared."
    
[force_move]
enable_force_move: True

