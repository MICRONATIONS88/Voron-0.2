[temperature_sensor CB1_temp]
sensor_type = temperature_host
min_temp = 10
max_temp = 100

[temperature_sensor mcu_temp]
sensor_type = temperature_mcu

[idle_timeout]
timeout = 1800

[homing_override]
axes = xyz
set_position_z = 0
gcode = 
	G90
	
	
	{% set home_all = (params.X is not defined) and (params.Y is not defined) and (params.Z is not defined) %}
	{% set do_x = home_all or (params.X is defined) %}
	{% set do_y = home_all or (params.Y is defined) %}
	{% set do_z = home_all or (params.Z is defined) %}
	{% set homed = printer.toolhead.homed_axes | lower %}
	{% set xy_will_be_homed = (do_x or "x" in homed) and (do_y or "y" in homed) %}
	
	{% if do_z and not printer["gcode_macro _PLR_HOME_STATE"].skip_z_home %}
	G0 Z5 F600
	{% endif %}
	{% if do_x and "x" not in homed and not printer["gcode_macro _PLR_HOME_STATE"].skip_xy_home %}
	G4 P2000
	SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=1
	SET_TMC_FIELD STEPPER=stepper_x FIELD=SGTHRS VALUE=80
	G28 X
	SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=0
	{% endif %}
	{% if do_y and "y" not in homed and not printer["gcode_macro _PLR_HOME_STATE"].skip_xy_home %}
	G4 P1000
	SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=1
	SET_TMC_FIELD STEPPER=stepper_y FIELD=SGTHRS VALUE=100
	G28 Y
	SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=0
	{% endif %}
	{% if do_z %}
	{% if not printer["gcode_macro _PLR_HOME_STATE"].skip_z_home %}
	G28 Z
	{% if xy_will_be_homed and not printer["gcode_macro _PLR_HOME_STATE"].skip_xy_park %}
	G0 X115 Y115 F3600
	{% endif %}
	G0 Z30 F1800
	{% else %}
	{% if xy_will_be_homed and not printer["gcode_macro _PLR_HOME_STATE"].skip_xy_park %}
	G0 X115 Y115 F3600
	{% endif %}
	SET_GCODE_VARIABLE MACRO=_PLR_HOME_STATE VARIABLE=skip_z_home VALUE=False
	{% endif %}
	{% endif %}
	SET_GCODE_VARIABLE MACRO=_PLR_HOME_STATE VARIABLE=skip_xy_park VALUE=False
	SET_GCODE_VARIABLE MACRO=_PLR_HOME_STATE VARIABLE=skip_xy_home VALUE=False

[firmware_retraction]
retract_length = 0.5
retract_speed = 50
unretract_extra_length = 0
unretract_speed = 35

[input_shaper]
#shaper_freq_x = 72.2
#shaper_type_x = mzv
#shaper_freq_y = 88.0
#shaper_type_y = 3hump_ei

[gcode_arcs]
resolution = 0.1

[force_move]
enable_force_move = True

[exclude_object]

[mcu display]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_2B0011000743303848373220-if00
restart_method: command

[display]
lcd_type: sh1106
i2c_mcu: display
i2c_bus: i2c1a
encoder_pins: ^display:PA4, ^display:PA3
click_pin: ^!display:PA1
kill_pin: ^!display:PA5
x_offset: 2

[neopixel displayStatus]
pin: display:PA0
chain_count: 1
color_order: GRB
initial_RED: 0.24
initial_GREEN: 0.02
initial_BLUE: 0.25

