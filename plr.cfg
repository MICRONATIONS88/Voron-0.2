# Power Loss Recovery (ADAM)

[save_variables]
filename = /home/adam/printer_data/config/plr_state.cfg

[gcode_shell_command plr_split]
command = python3 /home/adam/printer_data/config/plr_split.py
timeout = 60
verbose = True

[gcode_macro _PLR_VARS]
variable_last_save_time = 0.0
gcode =

[gcode_macro _PLR_SAVE]
description = Save current print state for PLR (Disk I/O保護・30秒インターバル制限版)
gcode = 
	{% if printer.virtual_sdcard.is_active and printer.print_stats.state == "printing" %}
	{% set cur_time = printer.toolhead.estimated_print_time %}
	{% set last_time = printer["gcode_macro _PLR_VARS"].last_save_time|float %}
	
	{% if (cur_time - last_time) >= 30.0 or last_time == 0.0 %}
	SET_GCODE_VARIABLE MACRO=_PLR_VARS VARIABLE=last_save_time VALUE={cur_time}
	{% set s = printer.save_variables.variables %}
	{% set pos = printer.virtual_sdcard.file_position %}
	{% set z = printer.toolhead.position.z|round(2) %}
	{% set bed_temp = printer.heater_bed.target|int %}
	{% set extruder_temp = printer.extruder.target|int %}
	{% set filename = printer.print_stats.filename %}
	
	
	{% if s.plr_active|default(0)|int != 1 %}
	SAVE_VARIABLE VARIABLE=plr_active VALUE=1
	{% endif %}
	{% if s.plr_bed|default(-1)|int != bed_temp %}
	SAVE_VARIABLE VARIABLE=plr_bed VALUE={bed_temp}
	{% endif %}
	{% if s.plr_ext|default(-1)|int != extruder_temp %}
	SAVE_VARIABLE VARIABLE=plr_ext VALUE={extruder_temp}
	{% endif %}
	{% if s.plr_file|default('') != filename %}
	SAVE_VARIABLE VARIABLE=plr_file VALUE='"{filename}"'
	{% endif %}
	
	
	SAVE_VARIABLE VARIABLE=plr_pos VALUE={pos}
	SAVE_VARIABLE VARIABLE=plr_z VALUE={z}
	{% endif %}
	{% endif %}

[delayed_gcode _PLR_AUTOSAVE]
initial_duration = 0
gcode = 
	# 印刷中のプチフリーズや負荷増大を防ぐため、定期保存を無効化
	pass

[delayed_gcode _PLR_BOOT_CHECK]
initial_duration = 8
gcode = 
	{% set s = printer.save_variables.variables %}
	{% if s.plr_active is defined and s.plr_active == 1 and s.plr_pos is defined and s.plr_pos > 0 %}
	M117 PLR: 電源断復旧可能!
	RESPOND TYPE=echo MSG="⚡ PLR: 印刷復旧データあり。PLR_RESUME を実行してください (ファイル: {s.plr_file}, Z: {s.plr_z}mm)"
	{% endif %}

[gcode_macro PLR_START]
description = PLR自動保存を開始 (PRINT_STARTから呼ぶ)
gcode = 
	SET_GCODE_VARIABLE MACRO=_PLR_VARS VARIABLE=last_save_time VALUE=0.0
	SAVE_VARIABLE VARIABLE=plr_active VALUE=0
	SAVE_VARIABLE VARIABLE=plr_pos VALUE=0
	RESPOND TYPE=echo MSG="PLR: 準備完了 (レイヤー切り替え時に SAVE_PRINT_PROGRESS を実行)"

[gcode_macro PLR_CLEAR]
description = PLRデータをクリア (PRINT_END/CANCEL_PRINTから呼ぶ)
gcode = 
	SET_GCODE_VARIABLE MACRO=_PLR_VARS VARIABLE=last_save_time VALUE=0.0
	SAVE_VARIABLE VARIABLE=plr_active VALUE=0
	SAVE_VARIABLE VARIABLE=plr_pos VALUE=0
	UPDATE_DELAYED_GCODE ID=_PLR_AUTOSAVE DURATION=0

[gcode_macro PLR_STATUS]
description = PLRデータを表示
gcode = 
	{% set s = printer.save_variables.variables %}
	{% if s.plr_active is defined and s.plr_active == 1 %}
	RESPOND TYPE=echo MSG="PLR STATUS: Z={s.plr_z}mm / pos={s.plr_pos} / Bed={s.plr_bed}°C / Ext={s.plr_ext}°C / File={s.plr_file}"
	{% else %}
	RESPOND TYPE=echo MSG="PLR STATUS: 保存データなし（plr_active=0）"
	{% endif %}

[gcode_macro _PLR_HOME_STATE]
description = PLRホーミング制御フラグ
variable_skip_z_home = False
variable_skip_xy_home = False
variable_skip_xy_park = False
gcode =

[gcode_macro PLR_RESUME]
description = 電源断・エラー後に自動でGコードを分割して印刷を再開する
gcode = 
	{% set s = printer.save_variables.variables %}
	{% if s.plr_active is defined and s.plr_active == 1
	and s.plr_pos is defined and s.plr_pos > 0 %}
	RESPOND TYPE=echo MSG="⚡ PLR: 復旧開始 file={s.plr_file} Z={s.plr_z}mm pos={s.plr_pos}"
	M117 PLR: Gコード生成中...
	RUN_SHELL_COMMAND CMD=plr_split
	RESPOND TYPE=echo MSG="✅ PLR: PLR_resume.gcode 生成完了。3秒後に印刷開始..."
	M117 PLR: 印刷開始準備中...
	UPDATE_DELAYED_GCODE ID=_PLR_START_PRINT DURATION=3
	{% else %}
	RESPOND TYPE=error MSG="PLR: 復旧データがありません (plr_active=0 or plr_pos=0)"
	{% endif %}

[delayed_gcode _PLR_START_PRINT]
initial_duration = 0
gcode = 
	RESPOND TYPE=echo MSG="▶️ PLR: PLR_resume.gcode の印刷を開始します"
	SDCARD_PRINT_FILE FILENAME=PLR_resume.gcode

[gcode_macro SAVE_PRINT_PROGRESS]
description = レイヤー切り替え時に現在の印刷進捗を保存
gcode = 
	_PLR_SAVE
