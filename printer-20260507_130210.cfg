[include mainsail.cfg]

# ===========================================================
# MCU & Printer Settings
# ===========================================================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_45503571290BFEF8-if00
restart_method: command

[mcu EBBCan]
# U2C経由のCAN接続用UUID
canbus_uuid: 5d095814ee1b

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 45
square_corner_velocity: 5.0

# ===========================================================
# X/Y Stepper Settings (Sensorless Homing)
# ===========================================================

[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.6
diag_pin: ^gpio4
driver_SGTHRS: 50
stealthchop_threshold: 0

[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.6
diag_pin: ^gpio3
driver_SGTHRS: 55
stealthchop_threshold: 0
# ===========================================================
# Z Stepper Settings
# ===========================================================

[stepper_z]
step_pin: gpio19
dir_pin: !gpio28
enable_pin: !gpio2
microsteps: 32
rotation_distance: 8
endstop_pin: ^gpio25
#position_endstop: 120
position_max: 120
homing_speed: 20

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.6
stealthchop_threshold: 0

# ===========================================================
# Extruder (EBB36) - 元の設定値を反映
# ===========================================================

[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
rotation_distance: 22.23 
gear_ratio: 50:10 
microsteps: 32
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan: PA3
control: pid
pid_Kp: 26.689
pid_Ki: 2.766
pid_Kd: 64.385
min_temp: 0
max_temp: 270

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.6
stealthchop_threshold: 0

# ===========================================================
# Fans & Bed
# ===========================================================

[fan] # Part Cooling Fan (EBB36)
pin: EBBCan: PA1

[heater_fan hotend_fan] # Hotend Fan (EBB36)
pin: EBBCan: PA0
heater: extruder
heater_temp: 50.0

[heater_bed]
heater_pin: gpio21        # 'pin:' から 'heater_pin:' に修正
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: gpio26
control: pid
pid_Kp: 63.153
pid_Ki: 2.506
pid_Kd: 397.864
min_temp: 0
max_temp: 110

# ===========================================================
# LED Control (Neopixel)
# ===========================================================

[neopixel board_neopixel]
pin: gpio24
chain_count: 20
color_order: GRB
initial_RED: 0.1
initial_GREEN: 0.1
initial_BLUE: 0.1

# ===========================================================
# ADXL345 (加速度センサー) & Input Shaper
# ===========================================================

[adxl345]
cs_pin: EBBCan: PB12
spi_software_sclk_pin: EBBCan: PB10
spi_software_mosi_pin: EBBCan: PB11
spi_software_miso_pin: EBBCan: PB2
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
probe_points:
    60, 60, 20  # Voron 0.2のベッド中央付近でテストを実行

# ===========================================================
# 運用マクロ (前回の設定を完全移植)
# ===========================================================

[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M117 Heating...
    M140 S{BED_TEMP}
    M104 S150 ; 予熱
    G28
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    _PURGE_LINE
    M117 Printing...

[gcode_macro PRINT_END]
gcode:
    M400
    G92 E0
    G1 E-2 F300
    G91
    G1 Z5 F3000
    G90
    G1 X110 Y110 F5000
    M104 S0
    M140 S0
    M106 S0
    M84
    M117 Finished

[gcode_macro _PURGE_LINE]
gcode:
    G90
    G1 X5 Y4 Z0.2 F3000
    G1 X5 Y50 E10 F1000
    G92 E0

[gcode_macro CLEAN_NOZZLE]
gcode:
    G90
    G1 X10 Y4 Z5 F5000
    {% for i in range(5) %}
        G1 X50 F5000
        G1 X10 F5000
    {% endfor %}

[temperature_sensor EBB36_temp]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

[temperature_sensor SKR_Pico_temp]
sensor_type: temperature_mcu

[bed_screws]
# Voron 0.2の120x120ベッドを想定した位置
screw1: 60, 5
screw1_name: front screw
screw2: 5, 115
screw2_name: back left
screw3: 115, 115
screw3_name: back right

[gcode_macro BED_LEVEL_ASSIST]
description: 手動ベッドレベリングを補助するために各ネジ位置へ移動します
gcode:
    G28 ; ホーミング[cite: 2]
    BED_SCREWS_ADJUST ; レベリングモード開始

[gcode_macro G32]
# Voronの標準的な準備マクロ
gcode:
    G28[cite: 2]
    # 必要に応じて、ここでノズルクリーニングなどを追加

[exclude_object]

