# ====================================================================
# BIGTREETECH EBB36 CANbus / USB Toolhead Board Configuration for ADAM
# Printer: Voron 0.2 (ADAM) with Dragonburner + Sherpa Mini/Micro
# Board: BIGTREETECH EBB36 v1.1 / v1.2
# ====================================================================

[mcu ebb36]
# CANbus UUID を設定してください (例: ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0 で確認)
canbus_uuid: 575fd2fc0a56
# USB接続の場合は上記canbus_uuidをコメントアウトし、以下を有効化してください:
# serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_...

# --------------------------------------------------------------------
# EBB36 オンボード温度センサー
# --------------------------------------------------------------------
[temperature_sensor EBB36]
sensor_type: temperature_mcu
sensor_mcu: ebb36

# --------------------------------------------------------------------
# エクストルーダー設定 (Orbiter 2.5 対応)
# --------------------------------------------------------------------
[extruder]
step_pin: ebb36:PD0
dir_pin: !ebb36:PD1
enable_pin: !ebb36:PD2

# Orbiter 2.5 Gear Ratio & Distance Settings
full_steps_per_rotation: 200
rotation_distance: 4.637
microsteps: 32
nozzle_diameter: 0.400
filament_diameter: 1.750

# ホットエンド・ヒーター & サーミスタ
heater_pin: ebb36:PB13
sensor_type: Generic 3950
sensor_pin: ebb36:PA3

smooth_time: 2.0
min_temp: 10
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
max_extrude_cross_section: 5

pressure_advance: 0.02
pressure_advance_smooth_time: 0.03

# PIDチューニング値 (※導入後に PID_CALIBRATE HEATER=extruder TARGET=220 を推奨)
control: pid
pid_kp: 30.319
pid_ki: 3.546
pid_kd: 64.806

# --------------------------------------------------------------------
# TMC2209 エクストルーダードライバー設定 (Orbiter 2.5 / LDO-36STH20)
# --------------------------------------------------------------------
[tmc2209 extruder]
uart_pin: ebb36:PA15
run_current: 0.850
stealthchop_threshold: 0
interpolate: False

# --------------------------------------------------------------------
# ファン設定 (Dragonburner 4010 ファン & ホットエンドファン)
# --------------------------------------------------------------------
# ホットエンド冷却ファン (FAN2 / PA1)
[heater_fan hotend_fan]
pin: ebb36:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

# パーツ冷却ファン (FAN1 / PA0)
[fan]
pin: ebb36:PA0
max_power: 1.0
kick_start_time: 0.5
off_below: 0.10

# --------------------------------------------------------------------
# オンボード ADXL345 加速度センサー (Input Shaper 用)
# --------------------------------------------------------------------
[adxl345]
cs_pin: ebb36:PB12
spi_software_sclk_pin: ebb36:PB10
spi_software_mosi_pin: ebb36:PB11
spi_software_miso_pin: ebb36:PB2
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
probe_points:
    60, 60, 20  # Voron 0.2 ベッド中央

# --------------------------------------------------------------------
# RGB LED / Stealthburner Neopixel (Dragonburner LED用)
# --------------------------------------------------------------------
[neopixel toolhead_leds]
pin: ebb36:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0
