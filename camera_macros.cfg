# ===========================================================
# C920 カメラ手動コントロールマクロ
# Mainsailコンソールから実行: CAMERA_SET PARAM=VALUE
# ===========================================================

[gcode_shell_command camera_set_v4l2]
command: v4l2-ctl
timeout: 5.0
verbose: False

[gcode_macro CAMERA_SET]
description: C920カメラ設定変更 例: CAMERA_SET EXPOSURE=300 WB=4500 FOCUS=50
gcode:
  {% set dev = "/dev/video1" %}
  {% set exposure    = params.EXPOSURE    | default(-1) | int %}
  {% set wb          = params.WB          | default(-1) | int %}
  {% set focus       = params.FOCUS       | default(-1) | int %}
  {% set brightness  = params.BRIGHTNESS  | default(-1) | int %}
  {% set contrast    = params.CONTRAST    | default(-1) | int %}
  {% set saturation  = params.SATURATION  | default(-1) | int %}
  {% set sharpness   = params.SHARPNESS   | default(-1) | int %}
  {% set gain        = params.GAIN        | default(-1) | int %}
  {% set zoom        = params.ZOOM        | default(-1) | int %}

  {% if exposure >= 0 %}
    RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d {dev} -c auto_exposure=1 -c exposure_time_absolute={exposure}"
    RESPOND MSG="Camera: Exposure = {exposure} (3-2047)"
  {% endif %}
  {% if wb >= 0 %}
    RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d {dev} -c white_balance_automatic=0 -c white_balance_temperature={wb}"
    RESPOND MSG="Camera: White Balance = {wb}K (2000-6500)"
  {% endif %}
  {% if focus >= 0 %}
    RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d {dev} -c focus_automatic_continuous=0 -c focus_absolute={focus}"
    RESPOND MSG="Camera: Focus = {focus} (0-250, step 5)"
  {% endif %}
  {% if brightness >= 0 %}
    RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d {dev} -c brightness={brightness}"
    RESPOND MSG="Camera: Brightness = {brightness} (0-255)"
  {% endif %}
  {% if contrast >= 0 %}
    RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d {dev} -c contrast={contrast}"
    RESPOND MSG="Camera: Contrast = {contrast} (0-255)"
  {% endif %}
  {% if saturation >= 0 %}
    RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d {dev} -c saturation={saturation}"
    RESPOND MSG="Camera: Saturation = {saturation} (0-255)"
  {% endif %}
  {% if sharpness >= 0 %}
    RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d {dev} -c sharpness={sharpness}"
    RESPOND MSG="Camera: Sharpness = {sharpness} (0-255)"
  {% endif %}
  {% if gain >= 0 %}
    RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d {dev} -c gain={gain}"
    RESPOND MSG="Camera: Gain = {gain} (0-255)"
  {% endif %}
  {% if zoom >= 0 %}
    RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d {dev} -c zoom_absolute={zoom}"
    RESPOND MSG="Camera: Zoom = {zoom} (100-500)"
  {% endif %}

[gcode_macro CAMERA_STATUS]
description: C920の現在の設定値を表示
gcode:
  RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d /dev/video1 --list-ctrls"

[gcode_macro CAMERA_AUTO]
description: C920をオート設定に戻す
gcode:
  RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d /dev/video1 -c white_balance_automatic=1 -c auto_exposure=3 -c focus_automatic_continuous=1"
  RESPOND MSG="Camera: オートモードに切り替えました"

[gcode_macro CAMERA_RESET]
description: C920を推奨デフォルト値にリセット (50Hz/WB4500K/露出300/フォーカス50)
gcode:
  RUN_SHELL_COMMAND CMD=camera_set_v4l2 PARAMS="-d /dev/video1 -c power_line_frequency=1 -c white_balance_automatic=0 -c white_balance_temperature=4500 -c auto_exposure=1 -c exposure_time_absolute=300 -c exposure_dynamic_framerate=0 -c focus_automatic_continuous=0 -c focus_absolute=50 -c brightness=128 -c contrast=128 -c saturation=128 -c sharpness=128 -c backlight_compensation=0"
  RESPOND MSG="Camera: デフォルト値にリセットしました"
